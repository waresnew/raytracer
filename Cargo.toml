[package]
name = "raytracer"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
clap-verbosity-flag = "3.0.4"
encase = "0.12.1"
env_logger = "0.11.11"
glam = { version = "0.33.3", features = ["debug-glam-assert", "encase"] }
image = "0.25.10"
indicatif = "0.18.6"
indicatif-log-bridge = "0.2.3"
log = "0.4.33"
pollster = "1.0.1"
rand = "0.10.2"
viuer = "0.11.0"
wesl = "0.4.2"
wgpu = "30.0.0"

[build-dependencies]
wesl = "0.4.2"
